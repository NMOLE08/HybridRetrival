<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10253f">
  <title>Identifier-Preserving Retrieval Demo</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <p class="eyebrow">PHASE 2 EXPLORATORY RESEARCH</p>
      <h1>Identifier-Aware Technical Search</h1>
      <p class="disclosure">Author-annotated exploratory study · not independently validated</p>
    </header>
    <section class="search-panel" aria-label="Search">
      <label for="query">Technical query</label>
      <div class="search-row">
        <input id="query" value="What product and weakness are associated with CVE-2023-46747?" maxlength="600">
        <button id="search">Run live retrieval</button>
      </div>
      <div class="samples">
        <button class="sample" data-query="What product and weakness are associated with CVE-2023-46747?">CVE-2023-46747</button>
        <button class="sample" data-query="What Apache HTTP Server path traversal is associated with CVE-2021-41773?">Apache path traversal</button>
        <button class="sample" data-query="What Linux memory handling race is identified as CVE-2016-5195?">Dirty COW</button>
      </div>
      <p id="status" role="status">Loading the locally cached model…</p>
    </section>
    <section id="config" class="config" hidden></section>
    <section id="results" class="results" aria-live="polite"></section>
  </main>
  <template id="card">
    <article class="method-card">
      <div class="method-heading"><h2></h2><span></span></div>
      <div class="rows"></div>
    </article>
  </template>
  <script src="app.js"></script>
</body>
</html>
