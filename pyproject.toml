[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "iphr"
version = "0.1.0"
description = "Identifier-preserving hybrid retrieval research"
requires-python = ">=3.11"
dependencies = ["sentence-transformers>=3.0,<6", "scikit-learn>=1.4,<2", "numpy>=1.26,<3", "pandas>=2.2,<4", "matplotlib>=3.8,<4", "PyYAML>=6,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[tool.setuptools.packages.find]
where = ["src"]
